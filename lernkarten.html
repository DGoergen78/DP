<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernkarten Daten &amp; Sicherheit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, prüfungsnah, nichts lenkt vom Lernen ab
   IDEA: ein Karteikasten: erst Fächer wählen, dann Karte für Karte ziehen
   PICTURE: die Auswahl selbst bzw. die große Karte ist das Bild
   COLOUR and TYPE: Meer #bfe3ee, Land #fbfbf2, Braun für Themen-Tags, Magenta für Korrekturen; Overpass
   LAYOUT: eine ruhige Spalte bis 820px; Auswahl → Karten → Ende */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf2,#0d1c24);--sea:light-dark(#bfe3ee,#12303c);--ink:light-dark(#13242e,#e4efe9);
--mute:light-dark(#4a5d66,#9fb4bb);--line:light-dark(#d8dccb,#24414d);--brown:light-dark(#a8551b,#d39a62);
--mag:light-dark(#d6127e,#ff6cb5);--card:light-dark(#ffffff,#112631);--ex:light-dark(#eaf5f8,#163542);--nt:light-dark(#f6f1e6,#1d2a2a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Overpass,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px)}
.wrap{max-width:820px;margin:0 auto}
header.band{background:var(--sea);padding-bottom:clamp(20px,3vw,32px)}
h1{font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
header p{margin:0;max-width:62ch}
h2{font-size:20px;margin:0 0 12px}
.view[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px);margin-bottom:18px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.chip input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin:0}
.chip span{flex:1}.chip small{color:var(--mute);font-size:13px}
.chip:has(input:checked){border-color:var(--ink);background:var(--ex)}
.chip.all{grid-column:1/-1;font-weight:600}
.chip:focus-within{outline:3px solid var(--mag);outline-offset:2px}
.count{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.count input[type=range]{flex:1 1 220px;height:44px;accent-color:var(--mag)}
.count output{font-size:32px;font-weight:800;min-width:4ch;text-align:right;white-space:nowrap}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.inner:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.small{padding:6px 12px;min-height:36px;font-size:14px}
#start{width:100%;font-size:18px;min-height:54px}
.warn{color:var(--mag);font-size:14px;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.prog{font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--mag);transition:width .3s}
.flip{perspective:1600px}
.inner{display:grid;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;border-radius:16px}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,32px);min-height:320px;display:flex;flex-direction:column;gap:12px}
.back{transform:rotateY(180deg)}
.tag{font-size:13px;font-weight:600;color:var(--brown)}
.front .q{font-size:clamp(21px,3.4vw,28px);font-weight:800;line-height:1.2;margin:auto 0;text-wrap:balance}
.hint{font-size:13px;color:var(--mute)}
.a{font-size:17px;margin:0}
.a ul,.ex ul{margin:4px 0 0;padding-left:20px}
.ex{background:var(--ex);border-radius:10px;padding:10px 14px;font-size:15px}
.nt{background:var(--nt);border-left:3px solid var(--brown);border-radius:0 10px 10px 0;padding:10px 14px;font-size:15px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.ex .lbl,.nt .lbl{color:var(--brown)}
pre{font:13px/1.45 'Overpass Mono',ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0 0;overflow-x:auto;white-space:pre}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}
.done{text-align:center}
.done .big{font-size:clamp(40px,8vw,60px);font-weight:800;line-height:1;color:var(--mag);margin:8px 0}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:600px){table{font-size:13px}.face{min-height:280px}}
@media(prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <h1>Lernkarten: Daten, Qualität &amp; Sicherheit</h1>
  <p>Karte antippen zum Umdrehen. Auf der Rückseite stehen Antwort und Beispiel.</p>
</div></header>

<main class="band"><div class="wrap">
<section class="view" id="v-setup">
  <div class="panel">
    <h2>Themengebiete</h2>
    <div class="chips" id="chips"></div>
  </div>
  <div class="panel">
    <h2>Anzahl Karten</h2>
    <div class="count"><input type="range" id="num" min="3" step="1" aria-label="Anzahl Karten"><output id="numOut"></output></div>
    <div class="presets" id="presets"></div>
    <p class="warn" id="warn" hidden>Bitte mindestens ein Themengebiet wählen.</p>
  </div>
  <div class="panel">
    <h2>Reihenfolge</h2>
    <div class="chips" role="radiogroup" aria-label="Reihenfolge">
      <label class="chip"><input type="radio" name="ord" value="fix"><span>Gleiche Reihenfolge</span><small>nach Thema sortiert</small></label>
      <label class="chip"><input type="radio" name="ord" value="rnd" checked><span>Zufällige Reihenfolge</span><small>jedes Mal neu gemischt</small></label>
    </div>
  </div>
  <button class="pri" id="start">Los geht's</button>
</section>

<section class="view" id="v-cards" hidden>
  <div class="top"><button class="small" id="back">← Auswahl</button><span class="prog" id="prog"></span></div>
  <div class="bar"><i id="barI"></i></div>
  <div class="flip" id="flip">
    <div class="inner" id="inner" tabindex="0" role="button" aria-label="Karte umdrehen">
      <div class="face front"><div class="tag" id="fTag"></div><div class="q" id="fQ"></div><div class="hint">Antippen oder Leertaste zum Umdrehen</div></div>
      <div class="face back"><div class="tag" id="bTag"></div><div id="bBody"></div></div>
    </div>
  </div>
  <div class="nav"><button id="prev">Zurück</button><button class="pri" id="next">Weiter</button></div>
</section>

<section class="view done" id="v-done" hidden>
  <div class="panel">
    <h2>Runde geschafft</h2>
    <div class="big" id="doneN"></div>
    <p id="doneT"></p>
    <div class="row"><button class="pri" id="again">Gleiche Karten neu mischen</button><button id="newSel">Neue Auswahl</button></div>
  </div>
</section>
</div></main>

<script>
{
const T={
 is:'Informationssicherheit & Datenschutz',
 inf:'IT-Infrastruktur & Schnittstellen',
 db:'Datenbanken & SQL',
 dw:'Data Lake & Data Warehouse',
 fm:'Datenformate',
 sg:'Strukturierte & unstrukturierte Daten',
 dqm:'Datenqualitätsmerkmale',
 dqp:'Datenqualität überprüfen',
 dqv:'Datenqualität verbessern',
 st:'Statistische Größen',
 an:'Analysearten',
 ml:'Maschinelles Lernen & Algorithmen',
 pq:'Prozessanalyse & Qualitätsmanagement'
};
/* t=Thema q=Frage a=Antwort b=Beispiel c=Code n=Hinweis(Korrektur/Ergänzung) */
const C=[
/* Informationssicherheit */
{t:'is',q:'Was sind die Hauptziele der Informationssicherheit?',a:'Die Sicherstellung von <b>Verfügbarkeit, Integrität und Vertraulichkeit</b> von Informationen (CIA-Triade).',b:'E-Mail verschlüsseln → Vertraulichkeit · Prüfsumme beim Download → Integrität · Backup → Verfügbarkeit.',n:'Oft kommen Authentizität und Verbindlichkeit (Nichtabstreitbarkeit) dazu.'},
{t:'is',q:'Warum ist die Verfügbarkeit von Daten und Systemen kritisch?',a:'Damit Benutzer bei Bedarf Zugriff auf Informationen und Dienste haben und Betriebsunterbrechungen vermieden werden.',b:'Ein DDoS-Angriff legt den Webshop für Stunden lahm. Kein Kunde kann bestellen. Schutz: redundante Server, Backups, USV.'},
{t:'is',q:'Was bedeutet die Integrität von Daten?',a:'Daten sind korrekt und vollständig und vor <b>unbefugter oder unbemerkter</b> Veränderung geschützt.',b:'Ein Angreifer ändert unbemerkt die IBAN auf einer Rechnung. Schutz: Hashwerte, digitale Signaturen.'},
{t:'is',q:'Warum ist die Vertraulichkeit von Informationen wichtig?',a:'Damit nur berechtigte Personen Zugriff auf sensible Informationen haben und Datenmissbrauch verhindert wird.',b:'Ein Praktikant öffnet ohne Berechtigung die Gehaltsliste. Schutz: Verschlüsselung, Berechtigungskonzept.'},
{t:'is',q:'Welchen Zweck verfolgt die Datenminimierung?',a:'Es werden nur die <b>für den Zweck</b> notwendigen Daten erhoben, gespeichert und so lange wie nötig aufbewahrt. Das senkt das Risiko für Betroffene und bei Datenlecks.',b:'Für einen Newsletter reicht die E-Mail-Adresse. Geburtsdatum und Telefonnummer abzufragen verstößt gegen die Datenminimierung.',n:'Datenschutzgrundsatz (Art. 5 Abs. 1 lit. c DSGVO) und Gewährleistungsziel des Standard-Datenschutzmodells (SDM), aber kein klassisches Ziel der Informationssicherheit.'},
{t:'is',q:'Was bedeutet Transparenz im Datenschutz?',a:'Betroffene können nachvollziehen, wie ihre Daten erfasst, verarbeitet und gespeichert werden.',b:'Verständliche Datenschutzerklärung; Verzeichnis der Verarbeitungstätigkeiten; Protokollierung von Zugriffen.',n:'Auch Verantwortliche und Aufsichtsbehörden sollen die Verarbeitung prüfen können. Gewährleistungsziel des Datenschutzes (SDM).'},
{t:'is',q:'Wie unterstützt die Intervenierbarkeit die Rechte von Betroffenen?',a:'Betroffene können in die Verarbeitung eingreifen, z. B. Berichtigung, Löschung, Einschränkung, Widerspruch oder Auskunft verlangen.',b:'Ein „Konto löschen“-Button, der tatsächlich alle Kundendaten in allen Systemen entfernt.',n:'Gewährleistungsziel des Datenschutzes (SDM).'},
{t:'is',q:'Warum ist die Nichtverkettung von Daten wichtig?',a:'Daten dürfen nur für den Zweck verarbeitet werden, für den sie erhoben wurden, und nicht <b>zweckfremd</b> mit Daten aus anderen Kontexten zusammengeführt werden.',b:'Eine Versicherung verknüpft Fitness-App-Daten mit Kundendaten, um Tarife zu berechnen → Verstoß. Schutz: getrennte Datenbestände, Pseudonymisierung.',n:'Verknüpfung ist nicht generell verboten, nur zweckfremd. Nichtverkettung sichert die Zweckbindung.'},
/* Datenqualität verbessern */
{t:'dqv',q:'Welche Techniken können die Datenqualität erhöhen?',a:'Fehlerkorrektur, einheitliche Datenformate, Redundanzvermeidung, Datenvalidierung und Sicherstellen der Aktualität.',b:'Alle Datumsangaben auf JJJJ-MM-TT vereinheitlichen; die PLZ schon bei der Eingabe auf 5 Ziffern prüfen; Dubletten zusammenführen.'},
{t:'dqv',q:'Was ist das Ziel der Datenbanknormalisierung?',a:'Vermeidung von Redundanz und von Anomalien (Einfüge-, Änderungs-, Löschanomalien) sowie Erhöhung der Datenintegrität.',b:'Die Kundenadresse steht in jeder Bestellung. Nach der Normalisierung liegt sie einmal in der Tabelle <i>Kunde</i>, Bestellungen verweisen per Kundennummer darauf.',n:'Normalisierung verteilt Daten auf mehr Tabellen. Einfacher wird die Pflege, nicht die Struktur.'},
{t:'dqv',q:'Wie können Daten auf ihre Plausibilität hin überprüft werden?',a:'Durch Vergleich mit festgelegten Kriterien, Konsistenzchecks und das Identifizieren ungültiger Werte.',b:'Netto + Steuer ≠ Brutto → unplausibel. Lieferdatum liegt vor dem Bestelldatum → unplausibel.'},
{t:'db',q:'Welche Unterschiede bestehen zwischen relationalen und NoSQL-Datenbanksystemen?',a:'Relationale DBs speichern Daten in Tabellen mit festem Schema, verknüpfen sie über Schlüssel und werden mit SQL abgefragt (meist ACID-Transaktionen). NoSQL-DBs nutzen flexiblere Modelle: Key-Value, Dokument, spaltenorientiert oder Graph.',b:'Relational: MySQL, PostgreSQL · Key-Value: Redis · Dokument: MongoDB · Graph: Neo4j.'},
{t:'db',q:'Welche Vorteile bietet eine NoSQL-Datenbank gegenüber einer relationalen?',a:'Höhere Flexibilität bei Datenstrukturen (kein starres Schema), oft besser horizontal skalierbar und für bestimmte Anwendungsfälle optimiert.',b:'Ein Produktkatalog, in dem jeder Artikel andere Attribute hat (Kleidung: Größe; Laptop: RAM), gespeichert als JSON-Dokumente in MongoDB.',n:'Nachteile sind oft schwächere Konsistenz (eventual consistency) und fehlende Joins.'},
/* Datenqualitätsmerkmale */
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Vollständigkeit?',a:'Ob alle für das Verfahren benötigten Daten (Datensätze und Attributwerte) vorhanden sind.',b:'Eine Krankenakte ist vollständig, wenn Diagnose, Behandlung, Medikation und Anamnese enthalten sind. Fehlt ein Befund, ist sie unvollständig.'},
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Korrektheit?',a:'Ob die Daten die Realität richtig abbilden. Feststellbar nur, wenn die Entstehung der Daten nachvollziehbar ist und Manipulationen oder Fehler ausgeschlossen werden können.',b:'Ein falsches Geburtsdatum in der Kundendatenbank führt zu einer falschen Altersberechnung.'},
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Konsistenz?',a:'Ob die Daten in sich und mit Daten aus anderen Quellen widerspruchsfrei sind.',b:'Die Banking-App zeigt 100 € Kontostand, der Geldautomat 90 € → inkonsistent.'},
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Redundanzfreiheit?',a:'Dass Informationen weder innerhalb der Daten noch im Abgleich mit anderen Quellen mehrfach abgebildet sind.',b:'Ein Kunde steht dreimal mit gleicher Adresse und Telefonnummer in der Kundenliste → redundant. Redundanzfrei: jeder Kunde genau einmal.'},
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Verfügbarkeit?',a:'Ob die Daten mit den vorhandenen technischen Werkzeugen verarbeitbar sind <b>und</b> ob sie rechtlich genutzt werden dürfen.',b:'Lagerbestände sind rund um die Uhr über die Lagerverwaltung abrufbar. Ausfälle oder fehlende Zugriffsrechte schränken das ein.',n:'Weiter gefasst als Verfügbarkeit in der Informationssicherheit, denn hier zählt auch die rechtliche Nutzbarkeit.'},
{t:'dqm',q:'Was beschreibt das Datenqualitätsmerkmal Einheitlichkeit?',a:'Dass die Daten auch aus heterogenen Quellen in einem kompatiblen, einheitlichen Format vorliegen.',b:'In einer multinationalen Datenbank stehen Datumsangaben teils als TT.MM.JJJJ, teils als JJJJ-MM-TT → vor der Verarbeitung vereinheitlichen.'},
/* Datenqualität überprüfen */
{t:'dqp',q:'Was wird bei der Plausibilitätsprüfung kontrolliert?',a:'Ob die Daten in sich logisch und realistisch sind.',b:'Land „Deutschland“, aber eine französische Postleitzahl → unplausibel. Netto + Steuer ≠ Brutto → unplausibel.',n:'Plausibel heißt nicht automatisch korrekt.'},
{t:'dqp',q:'Was wird bei der Prüfung der Quantität kontrolliert?',a:'Ob genügend Datensätze und Werte für den geplanten Zweck vorhanden sind.',b:'Für eine Umsatzprognose je Region liegen nur Daten aus drei Monaten vor → Menge reicht nicht für saisonale Aussagen.'},
{t:'dqp',q:'Was wird bei der Prüfung auf Redundanz kontrolliert?',a:'Ob es doppelte Datensätze gibt, die dieselbe Information enthalten.',b:'Zwei Kundendatensätze sind identisch bis auf die E-Mail-Adresse → wahrscheinlich eine Dublette.'},
{t:'dqp',q:'Was wird bei der Prüfung der Vollständigkeit kontrolliert?',a:'Ob für jeden Datensatz alle benötigten Informationen vorhanden sind.',b:'Hat jeder Kunde eine E-Mail-Adresse? Fehlt bei 200 Datensätzen das Alter → unvollständig.'},
{t:'dqp',q:'Was wird bei der Prüfung der Validität kontrolliert?',a:'Ob die Daten den festgelegten Regeln, Formaten und Wertebereichen entsprechen, also gültig sind.',b:'Alter „200“ oder „−10“ liegt außerhalb des gültigen Bereichs → nicht valide. E-Mail ohne @ → nicht valide.',n:'Fehlende Werte betreffen die Vollständigkeit, nicht die Validität.'},
{t:'dqp',q:'Was ist der Unterschied zwischen Validität und Plausibilität?',a:'<b>Plausibilität</b> = logisch und realistisch (passt es zusammen?).<br><b>Validität</b> = entspricht den Regeln und Standards, korrekt und echt.',b:'Plausibel, aber nicht valide: Die Telefonnummer hat das richtige Format, existiert aber nicht.<br>Unplausibel: Deutschland mit französischer PLZ.'},
/* Statistik */
{t:'st',q:'Was beschreibt das arithmetische Mittel und wie wird es berechnet?',a:'Den Durchschnitt: Summe aller Werte ÷ Anzahl der Werte. Empfindlich gegenüber Ausreißern.',b:'2, 4, 6, 8, 10 → 30 ÷ 5 = <b>6</b>.<br>Mit Ausreißer 2, 4, 6, 8, 100 → 120 ÷ 5 = <b>24</b>.'},
{t:'st',q:'Wie wird der Median bestimmt?',a:'Werte sortieren. Bei ungerader Anzahl ist er der mittlere Wert, bei gerader Anzahl das Mittel der beiden mittleren Werte. Robust gegenüber Ausreißern.',b:'2, 4, 6, 8, 10 → Median <b>6</b>.<br>1, 3, 5, 7 → (3 + 5) ÷ 2 = <b>4</b>.<br>2, 4, 6, 8, 100 → Median bleibt <b>6</b>.'},
{t:'st',q:'Was misst die Varianz und wie wird sie berechnet?',a:'Die Streuung: Sie ist der Mittelwert der <b>quadrierten</b> Abweichungen vom Mittelwert.',b:'2, 4, 6, 8, 10 (Mittel 6):<br>(16 + 4 + 0 + 4 + 16) ÷ 5 = <b>8</b>',n:'Teilen durch n gilt für die Grundgesamtheit. Bei einer Stichprobe teilt man durch n − 1 (hier: 40 ÷ 4 = 10).'},
{t:'st',q:'Was beschreibt die Standardabweichung?',a:'Die Streuung der Werte um den Mittelwert. Sie ist die Quadratwurzel der Varianz und hat dieselbe Einheit wie die Daten.',b:'Varianz 8 → √8 ≈ <b>2,83</b>.',n:'Die Standardabweichung ist nicht exakt der durchschnittliche Abstand. Der läge hier bei (4 + 2 + 0 + 2 + 4) ÷ 5 = 2,4.'},
{t:'st',q:'Was zeigt der Vergleich der Standardabweichung zweier Gehaltsstrukturen?',a:'Eine kleine Standardabweichung bedeutet eine gleichmäßige Gehaltsstruktur, eine große starke Unterschiede zwischen niedrigen und hohen Gehältern.',b:'<b>A:</b> 2.000 · 2.500 · 3.000 · 3.500 · 4.000 € → Mittel 3.000 €, σ ≈ 707 €<br><b>B:</b> 1.000 · 2.000 · 3.000 · 8.000 · 12.000 € → Mittel 5.200 € (Median 3.000 €), σ ≈ 4.167 €'},
{t:'st',q:'Was ist die Spannweite?',a:'Die Differenz zwischen größtem und kleinstem Wert. Einfaches Streuungsmaß, aber stark von Ausreißern abhängig.',b:'2, 4, 6, 8, 10 → 10 − 2 = <b>8</b>.'},
{t:'st',q:'Was misst die Entropie und wie wird sie berechnet?',a:'Die Unsicherheit bzw. Zufälligkeit einer Verteilung:<br>H = −(p₁·log₂ p₁ + p₂·log₂ p₂ + … + pₖ·log₂ pₖ)',b:'p = 0,2 / 0,3 / 0,5 → H ≈ <b>1,485 Bit</b>. Maximum bei 3 gleich wahrscheinlichen Werten: log₂ 3 ≈ 1,585 Bit.'},
{t:'st',q:'Was bedeutet eine hohe bzw. niedrige Entropie?',a:'<b>Hoch:</b> gleichmäßige Verteilung, schwer vorherzusagen.<br><b>Niedrig:</b> einzelne Werte dominieren, klare Muster, gut vorherzusagen.',b:'Online-Shop mit 4 Kategorien: je 25 % → H = <b>2 Bit</b> (Maximum) → breites Sortiment sinnvoll. 80 % Elektronik, Rest gleich verteilt → H ≈ <b>1,04 Bit</b> → Spezialisierung lohnt sich.'},
{t:'st',q:'Warum sind Kenntnisse über Verteilungen in der Statistik wichtig?',a:'Verteilungen beschreiben, wie Datenpunkte verteilt sind. Sie zeigen Struktur und Charakteristik der Daten und erlauben es, Wahrscheinlichkeiten und Erwartungen für künftige Daten abzuleiten.',b:'Ist die Lieferzeit normalverteilt mit Mittel 3 Tage, lässt sich abschätzen, wie viele Pakete länger als 5 Tage brauchen.'},
{t:'st',q:'Welche Verteilung beschreibt oft natürliche Phänomene?',a:'Die <b>Normalverteilung</b> (Gaußsche Glockenkurve): symmetrisch um den Mittelwert, Mittelwert = Median.',b:'Körpergröße, Messfehler. Rund 68 % der Werte liegen innerhalb ±1 Standardabweichung, rund 95 % innerhalb ±2.'},
/* Analysearten */
{t:'an',q:'Welche vier Analysestufen bauen aufeinander auf und welche Frage beantworten sie?',a:'<b>Deskriptiv:</b> Was ist passiert?<br><b>Diagnostisch:</b> Warum ist es passiert?<br><b>Prädiktiv:</b> Was wird passieren?<br><b>Präskriptiv:</b> Was sollen wir tun?',b:'Umsatz fiel im März (deskriptiv) → wegen Lieferengpass (diagnostisch) → im April droht dasselbe (prädiktiv) → zweiten Lieferanten beauftragen (präskriptiv).'},
{t:'an',q:'Was ist eine deskriptive Analyse?',a:'Sie fasst Daten zusammen und gibt einen Überblick über vergangene Ereignisse und Muster.',b:'Monatliche Verkaufsdaten je Region zeigen vergangene Trends und saisonale Muster.'},
{t:'an',q:'Was ist eine diagnostische Analyse?',a:'Sie untersucht die Ursachen bestimmter Ereignisse, indem sie Muster und Zusammenhänge analysiert.',b:'Ein Krankenversicherer untersucht, warum die Kosten in einer Region steigen, z. B. durch höhere Krankheitsraten oder teure Behandlungen.'},
{t:'an',q:'Was ist eine prädiktive Analyse?',a:'Sie nutzt historische Daten und statistische Modelle, um künftige Ereignisse oder Trends vorherzusagen.',b:'Ein Online-Shop prognostiziert aus früheren Käufen die Nachfrage der nächsten Saison und plant den Lagerbestand.'},
{t:'an',q:'Was ist eine präskriptive Analyse?',a:'Sie empfiehlt auf Basis von Vorhersagen konkrete Handlungsoptionen, um optimale Ergebnisse zu erzielen.',b:'Ein Logistikunternehmen lässt sich aus Verkehrsprognosen die besten LKW-Routen empfehlen → kürzere Lieferzeiten, geringere Kosten.'},
{t:'an',q:'Was ist eine explorative Analyse?',a:'Sie dient dem Entdecken unbekannter Muster oder Beziehungen in den Daten, ohne eine bestimmte Hypothese zu prüfen.',b:'Ein Forscher durchsucht Social-Media-Daten nach neuen Trends und Verhaltensmustern.'},
{t:'an',q:'Was ist eine Kausalanalyse?',a:'Sie untersucht Ursache-Wirkungs-Zusammenhänge, um zu verstehen, welche Faktoren ein Ergebnis tatsächlich bewirken.',b:'Ein Pharmaunternehmen prüft in einer Studie mit Kontrollgruppe, ob eine neue Dosis den Krankheitsverlauf verbessert.',n:'Korrelation ist nicht Kausalität. Ein bloßer Zusammenhang reicht nicht. Kausalität belegt man z. B. mit kontrollierten, randomisierten Experimenten.'},
{t:'an',q:'Was ist eine agnostische Analyse?',a:'Sie untersucht Daten ohne vorgefasste Annahmen oder Hypothesen und lässt die Daten für sich sprechen.',b:'Ein Data-Science-Team durchsucht große Datensätze ohne Erwartungen nach Korrelationen, die weitere Forschung anregen.',n:'Kein gängiger Standardbegriff; inhaltlich eng verwandt mit der explorativen Analyse.'},
/* Datenformate */
{t:'fm',q:'Was ist ein Datenbankschema?',a:'Die Umsetzung eines Datenmodells für ein konkretes Datenbanksystem. Es beschreibt die Struktur der Daten formal, z. B. die Tabellen einer relationalen Datenbank.',c:'CREATE TABLE Kunde (\n  KundenNr  INT PRIMARY KEY,\n  Name      VARCHAR(100) NOT NULL,\n  PLZ       CHAR(5)\n);'},
{t:'fm',q:'Wie speichern Tabellenkalkulationen Daten?',a:'Strukturiert in Zeilen und Spalten. Excel (.xlsx) und Numbers nutzen eigene Formate, die andere Systeme nur eingeschränkt lesen. Ein offenes Format ist <b>.ods</b> (OpenDocument Spreadsheet).',b:'Eine Umsatzliste in Excel: Spalten Datum, Region, Umsatz.',n:'Das heutige .xlsx ist als Office Open XML genormt (ISO/IEC 29500).'},
{t:'fm',q:'Was zeichnet XML aus?',a:'Extensible Markup Language: strukturiert Daten mit Tags, ist reiner Text. Die Struktur lässt sich in einem Schema (XSD, DTD) beschreiben und Dokumente automatisch auf Gültigkeit prüfen.',c:'<kunde id="17">\n  <name>Anna Berg</name>\n  <plz>10115</plz>\n</kunde>'},
{t:'fm',q:'Was zeichnet JSON aus?',a:'JavaScript Object Notation: textbasiertes Datenaustauschformat aus Objekten (Schlüssel-Wert-Paaren) und Arrays. Kompakter als XML.',c:'{\n  "id": 17,\n  "name": "Anna Berg",\n  "plz": "10115"\n}',n:'Auch JSON lässt sich per JSON Schema automatisch prüfen.'},
{t:'fm',q:'Was ist das INI-Format?',a:'Ein textbasiertes Format aus Schlüssel-Wert-Paaren, oft in Abschnitte gegliedert. Typisch für Konfigurationsdateien.',c:'[datenbank]\nhost = localhost\nport = 5432'},
{t:'fm',q:'Was ist CSV?',a:'Comma Separated Values: Tabellendaten als Text, Spalten durch Trennzeichen getrennt. Im deutschen Raum wegen des Dezimalkommas oft mit Semikolon.',c:'KundenNr;Name;Umsatz\n17;Anna Berg;1250,50\n18;Tom Lenz;980,00'},
/* Strukturierungsgrad */
{t:'sg',q:'Was sind strukturierte Daten?',a:'Daten mit festgelegtem Format. Die Struktur erschließt dem Computersystem die Bedeutung der Daten.',b:'Relationale Datenbanken, Excel-Tabellen mit festen Spalten, Kontoauszüge, Sensordaten (Zeitstempel + Messwert).'},
{t:'sg',q:'Was sind semistrukturierte Daten?',a:'Daten mit einer gewissen Struktur (Tags, Attribute, Metadaten), deren Bedeutung aber nicht vollständig erschlossen ist; der Inhalt kann variieren.',b:'XML, JSON, Log-Dateien (fester Zeitstempel, freie Ereignisbeschreibung), E-Mails (Kopfzeilen + Freitext), Fotos mit Metadaten.'},
{t:'sg',q:'Was sind unstrukturierte Daten?',a:'Daten ohne vorgegebenes Format, die für die Nutzung erst erschlossen werden müssen.',b:'Freitexte, Bilder, Videos, Sprach- und Tonaufnahmen, z. B. Kundenbewertungen als Fließtext.'},
{t:'sg',q:'Wie können strukturierte und unstrukturierte Anteile in einem Datensatz zusammenkommen?',a:'Ein semistrukturierter Datensatz kombiniert strukturierte Felder (Metadaten) mit unstrukturiertem Inhalt.',c:'{\n  "username": "@datafan",\n  "timestamp": "2024-03-01T10:15:00Z",\n  "likes": 42,\n  "hashtags": ["BigData"],\n  "content": "Heute endlich den Data Lake aufgeräumt …"\n}',b:'Strukturiert: username, timestamp, likes, hashtags · Unstrukturiert: der Freitext in content.'},
/* Data Lake / DWH */
{t:'dw',q:'Was versteht man unter einem Data Warehouse?',a:'Ein zentrales Repositorium, das Daten aus verschiedenen Quellen bereinigt, vereinheitlicht und historisiert speichert und für Analysen und komplexe Abfragen optimiert ist (OLAP, Business Intelligence).',b:'Kundennummer, Produkt-ID, Verkaufsdatum, Region, Menge und Umsatz aus Shop, Filialen und CRM in einer Datenbasis.',n:'Klassische Merkmale nach Inmon: themenorientiert, integriert, zeitbezogen, nicht-flüchtig.'},
{t:'dw',q:'Warum werden Daten in einem Data Warehouse zentral gespeichert?',a:'Für vereinfachte Datenanalyse, zentrale Datenverfügbarkeit und optimierte Abfrageperformance, ohne die operativen Systeme zu belasten.',b:'Der Vertrieb wertet Umsätze aller Kanäle in einem Bericht aus, statt Shop, Filialsystem und CRM einzeln abzufragen.'},
{t:'dw',q:'Was ist ein Data Lake?',a:'Ein zentraler Speicher für <b>Rohdaten</b> in allen Formaten (strukturiert, semistrukturiert, unstrukturiert). Geeignet für Big Data, KI und Machine Learning.',b:'Klickdaten (Logs, JSON), Kundenbewertungen als Text, Produktbilder (JPEG/PNG), Sensordaten aus Lager-Scannern.',n:'Data Lake = „schema-on-read“ (Struktur erst beim Auslesen), Data Warehouse = „schema-on-write“ (Struktur beim Laden).'},
{t:'dw',q:'Wofür dient eine klassische (operative) Datenbank?',a:'Sie unterstützt die täglichen Geschäftsprozesse und ist auf viele schnelle Transaktionen ausgelegt (<b>OLTP</b>).',b:'Ein Online-Shop speichert neue Bestellungen, Kundendaten und aktuelle Lagerbestände.'},
{t:'dw',q:'Wie unterscheiden sich klassische Datenbank, Data Warehouse und Data Lake?',a:'<table><tr><th></th><th>Zweck</th><th>Format</th></tr><tr><td>Datenbank</td><td>Tagesbetrieb (OLTP)</td><td>strukturiert</td></tr><tr><td>Data Warehouse</td><td>Analyse, Berichte (OLAP)</td><td>strukturiert, bereinigt</td></tr><tr><td>Data Lake</td><td>Rohdaten flexibel speichern</td><td>alle Formate</td></tr></table>',b:'Bestellung speichern → Datenbank · Umsatz pro Region → Data Warehouse · Logfiles und Sensordaten sammeln → Data Lake.'},
{t:'dw',q:'Was ist ein ETL-Prozess?',a:'<b>Extract, Transform, Load:</b> Daten aus Quellen entnehmen, bereinigen und vereinheitlichen, dann ins Data Warehouse laden. Ziel: hohe Datenqualität, einheitliches Format.',b:'CRM-Kundendaten + Shop-Verkaufsdaten → transformieren → ins DWH laden. Typischer Ablauf: Rohdaten → Data Lake → ETL → Data Warehouse.',n:'Bei ELT wird zuerst geladen und erst im Zielsystem transformiert. Das ist häufig bei Data Lakes und Cloud-DWHs.'},
{t:'dw',q:'Was sind OLAP-Datenbanken?',a:'Für Analysen optimierte Datenbanken, die Daten mehrdimensional (in Cubes) organisieren und schnelle Auswertungen aus verschiedenen Blickwinkeln erlauben (Slice & Dice, Drill-down).',b:'Verkaufs-Cube mit Zeit, Region, Produkt: „Umsatz nach Produktgruppe im Januar 2024 in Berlin“.'},
{t:'dw',q:'Was ist ein Cube?',a:'Eine mehrdimensionale Datenstruktur: Jede Achse ist eine Dimension (z. B. Zeit, Region, Produkt), im Inneren liegen Kennzahlen (Fakten) wie Umsatz oder Stückzahl. Viele Summen sind vorberechnet, daher sehr schnelle Abfragen.',b:'„Umsatz im Januar 2024 in Berlin für Laptops?“ wird direkt aus dem Cube beantwortet.'},
{t:'dw',q:'Was ist SSAS?',a:'SQL Server Analysis Services: Microsoft-Technologie zum Erstellen und Verwalten von OLAP-Cubes (und tabellarischen Modellen) sowie für Data Mining, im Zusammenspiel mit SQL Server.',b:'Ein Cube analysiert Umsätze nach Filiale, Produktgruppe und Zeitraum.'},
{t:'dw',q:'Was sind Slowly Changing Dimensions (Typ 1, 2, 3)?',a:'Verfahren für langsam veränderliche Stammdaten im DWH:<ul><li><b>Typ 1:</b> überschreiben, keine Historie</li><li><b>Typ 2:</b> neue Zeile je Änderung, volle Historie (z. B. mit gültig-von/bis)</li><li><b>Typ 3:</b> alter und neuer Wert in zwei Spalten</li></ul>',b:'Kunde zieht um: Bei Typ 1 braucht der Shop nur die aktuelle Lieferadresse. Bei Typ 2 soll der Umsatz „Berlin“ Kunden enthalten, die damals dort wohnten. Bei Typ 3 vergleicht das Callcenter Verhalten vor und nach dem Umzug.'},
{t:'dw',q:'Was ist Knowledge Discovery in Databases (KDD)?',a:'Der Prozess, aus großen Datenmengen neues Wissen zu gewinnen: Auswahl/Vorbereitung → Bereinigung → Transformation → Data Mining → Interpretation.',b:'Kaufverhalten analysieren, um Produktempfehlungen zu erzeugen („Kunden kauften auch …“).',n:'Standardmodell nach Fayyad: Selektion → Vorverarbeitung → Transformation → Data Mining → Interpretation.'},
/* Datenbanken & SQL */
{t:'db',q:'Wofür stehen die vier Buchstaben des ACID-Prinzips?',a:'<b>A</b>tomicity: alles oder nichts<br><b>C</b>onsistency: DB bleibt in konsistentem Zustand<br><b>I</b>solation: parallele Transaktionen stören sich nicht<br><b>D</b>urability: bestätigte Änderungen bleiben dauerhaft',b:'Überweisung: Abbuchen und Gutschreiben gelingen beide oder keines (A). Nach dem Commit übersteht die Buchung auch einen Stromausfall (D).'},
{t:'db',q:'Was ist der Unterschied zwischen WHERE und HAVING in SQL?',a:'<b>WHERE</b> filtert einzelne Zeilen <b>vor</b> der Gruppierung. <b>HAVING</b> filtert Gruppen anhand aggregierter Werte <b>nach</b> dem GROUP BY.',c:'SELECT Region, SUM(Umsatz) AS Gesamt\nFROM Verkauf\nWHERE Jahr = 2024          -- Zeilen filtern\nGROUP BY Region\nHAVING SUM(Umsatz) > 100000; -- Gruppen filtern'},
{t:'db',q:'Wie heißen Table, Row und Column in einer dokumentenorientierten NoSQL-Datenbank?',a:'Table → <b>Collection</b><br>Row → <b>Document</b><br>Column → <b>Field</b>',c:'// Collection "kunden", ein Document:\n{ "_id": 17, "name": "Anna Berg", "plz": "10115" }\n//           ^ Field'},
/* Data Warehouse */
{t:'dw',q:'Aus welchen zwei Tabellentypen besteht ein Sternschema?',a:'Einer zentralen <b>Faktentabelle</b> mit Kennzahlen (z. B. Umsatz, Menge) und Fremdschlüsseln, umgeben von mehreren <b>Dimensionstabellen</b> mit beschreibenden Attributen (Kontext).',b:'Fakt <i>Verkauf</i> (Datum_ID, Produkt_ID, Filiale_ID, Menge, Umsatz) → Dimensionen <i>Zeit</i>, <i>Produkt</i>, <i>Filiale</i>.',n:'Werden Dimensionstabellen weiter normalisiert, spricht man vom Schneeflockenschema.'},
/* Maschinelles Lernen */
{t:'ml',q:'Was ist der Unterschied zwischen Supervised und Unsupervised Learning?',a:'<b>Supervised:</b> Die Trainingsdaten enthalten bekannte Zielwerte (Labels); das Modell lernt, diese vorherzusagen.<br><b>Unsupervised:</b> Keine Labels; der Algorithmus sucht selbstständig Muster oder Cluster.',b:'Supervised: E-Mails anhand markierter Beispiele als Spam/kein Spam klassifizieren. Unsupervised: Kunden per k-Means in Segmente gruppieren.'},
{t:'ml',q:'Welches Maß nutzt der ID3-Algorithmus zur Auswahl des Verzweigungsknotens?',a:'Die <b>Entropie</b> (Unreinheit). Gewählt wird das Attribut mit dem höchsten <b>Informationsgewinn</b> (Information Gain) = Entropie vorher − gewichtete Entropie nach der Aufteilung.',b:'Teilt „Wetter“ die Daten in nahezu reine Gruppen (fast nur „Ja“ bzw. „Nein“), sinkt die Entropie stark → Wetter wird Wurzelknoten.'},
{t:'ml',q:'Welches Abstandsmaß nutzt k-Nearest-Neighbor meist?',a:'Meist die <b>euklidische Distanz</b>: d = √((x₂ − x₁)² + (y₂ − y₁)²). Möglich sind auch andere Maße, z. B. die Manhattan-Distanz.',b:'Punkte (1|2) und (4|6): √(3² + 4²) = √25 = <b>5</b>. Bei k = 3 entscheidet die Mehrheitsklasse der drei nächsten Nachbarn.',n:'Merkmale vorher skalieren, sonst dominiert das Merkmal mit dem größten Wertebereich den Abstand.'},
{t:'ml',q:'Was ist Bootstrapping beim Random Forest?',a:'Das Ziehen zufälliger Stichproben <b>mit Zurücklegen</b> aus den Trainingsdaten, um viele unterschiedliche Entscheidungsbäume zu trainieren. Die Bäume stimmen am Ende ab (Mehrheit bzw. Mittelwert).',b:'Aus 1.000 Datensätzen werden je Baum 1.000 Datensätze gezogen, manche doppelt, manche gar nicht.',n:'Zusätzlich betrachtet jeder Baum an jedem Knoten nur eine zufällige Auswahl von Merkmalen.'},
{t:'ml',q:'Wofür stehen β₀ und β₁ in der linearen Regression y = β₀ + β₁ · x?',a:'<b>β₀</b> = y-Achsenabschnitt (Wert von y bei x = 0)<br><b>β₁</b> = Steigung (Änderung von y pro Einheit x)',b:'Umsatz = 2.000 + 50 · Werbebudget(in 100 €): Ohne Werbung 2.000 €, je 100 € Werbung 50 € mehr Umsatz.'},
{t:'ml',q:'Wofür wird die logistische Regression eingesetzt?',a:'Für <b>binäre Klassifikation</b> (Ja/Nein). Sie liefert eine Wahrscheinlichkeit zwischen 0 und 1 (Sigmoid-Funktion), die über einen Schwellenwert einer Klasse zugeordnet wird.',b:'Retoure ja/nein: Modell gibt 0,73 aus → bei Schwelle 0,5 „Retoure“.'},
/* Prozessanalyse & Qualität */
{t:'pq',q:'Nenne die 5 Standard-Kategorien (5M) des Ishikawa-Diagramms.',a:'<b>Mensch, Maschine, Material, Methode, Milieu</b> (Mitwelt).',b:'Problem „Lieferung verspätet“: Mensch: Personal krank · Maschine: Scanner defekt · Material: Verpackung fehlt · Methode: unklarer Ablauf · Milieu: Glatteis.',n:'Erweitert zu 7M um Messung und Management.'},
{t:'pq',q:'Was ist der Unterschied zwischen XOR-, AND- und OR-Gateway in BPMN?',a:'<b>XOR</b> (exklusiv): genau ein Pfad<br><b>AND</b> (parallel): alle Pfade gleichzeitig<br><b>OR</b> (inklusiv): einer oder mehrere Pfade',b:'XOR: Bestellwert > 500 € → Freigabe, sonst direkt versenden. AND: Rechnung erstellen und Ware kommissionieren parallel. OR: Benachrichtigung per E-Mail und/oder SMS.'},
{t:'pq',q:'Welches Element folgt in einer EPK auf ein Ereignis?',a:'Eine <b>Funktion</b>. Ereignisse und Funktionen wechseln sich ab (ggf. über Konnektoren dazwischen). Ausnahme: das Endereignis.',b:'Ereignis „Bestellung eingegangen“ → Funktion „Bestellung prüfen“ → Ereignis „Bestellung geprüft“.',n:'Nach einem einzelnen Ereignis darf keine XOR- oder OR-Verzweigung folgen, denn Ereignisse können nicht entscheiden.'},
{t:'pq',q:'Wie berechnet sich die Risikoprioritätszahl (RPZ) bei einer FMEA?',a:'RPZ = <b>A × B × E</b><br>A = Auftretenswahrscheinlichkeit, B = Bedeutung, E = Entdeckungswahrscheinlichkeit; je 1–10, also RPZ 1–1.000.',b:'A = 4, B = 8, E = 6 → RPZ = 192. Je höher, desto dringender die Maßnahme.',n:'Bei E bedeutet ein hoher Wert: Fehler wird <i>schlecht</i> entdeckt.'},
{t:'pq',q:'Nenne die vier Phasen des PDCA-Zyklus (Deming-Kreis).',a:'<b>Plan:</b> planen<br><b>Do:</b> umsetzen (im Kleinen testen)<br><b>Check:</b> überprüfen<br><b>Act:</b> handeln, standardisieren oder anpassen',b:'Plan: Dubletten in der Kundendatenbank senken · Do: Prüfregel in einer Filiale testen · Check: Dubletten −40 % · Act: Regel überall einführen.'},
/* IT-Infrastruktur */
{t:'inf',q:'Welcher Umrechnungsfaktor gilt bei Binärpräfixen (KiB, MiB, GiB)?',a:'Faktor <b>1.024</b> (2¹⁰). Dezimalpräfixe (kB, MB, GB) rechnen mit 1.000.',b:'1 GiB = 1.024 MiB = 1.073.741.824 Byte · 1 GB = 1.000.000.000 Byte. Darum zeigt das Betriebssystem eine „1-TB“-Platte als ≈ 931 GiB.'},
{t:'inf',q:'Welchen Vor- und Nachteil hat RAID 0 gegenüber RAID 1?',a:'<b>RAID 0</b> (Striping): höhere Performance, volle Kapazität, aber <b>keine</b> Ausfallsicherheit.<br><b>RAID 1</b> (Spiegelung): hohe Ausfallsicherheit, aber nur 50 % nutzbare Kapazität (bei 2 Platten).',b:'2 × 2 TB: RAID 0 → 4 TB, eine Platte defekt = alle Daten weg. RAID 1 → 2 TB, eine Platte darf ausfallen.',n:'RAID ersetzt kein Backup. Versehentliches Löschen wird sofort mitgespiegelt.'},
{t:'inf',q:'Welche HTTP-Methoden entsprechen den CRUD-Operationen?',a:'Create → <b>POST</b><br>Read → <b>GET</b><br>Update → <b>PUT</b> (ganz ersetzen) / <b>PATCH</b> (teilweise ändern)<br>Delete → <b>DELETE</b>',c:'POST   /kunden       neuen Kunden anlegen\nGET    /kunden/17    Kunde 17 lesen\nPATCH  /kunden/17    PLZ ändern\nDELETE /kunden/17    Kunde 17 löschen'},
/* Informationssicherheit */
{t:'is',q:'Nenne die drei Faktor-Kategorien der Mehrfaktor-Authentifizierung.',a:'<b>Wissen</b> (Passwort, PIN)<br><b>Besitz</b> (Smartphone, Token, Chipkarte)<br><b>Inhärenz</b> (Fingerabdruck, Gesichtserkennung)',b:'Online-Banking: Passwort (Wissen) + Freigabe in der Banking-App (Besitz).',n:'Zwei Faktoren müssen aus <i>verschiedenen</i> Kategorien stammen. Passwort + Sicherheitsfrage ist keine 2FA.'}
];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const keys=Object.keys(T);
const cnt=k=>C.filter(c=>c.t===k).length;

/* Auswahl */
const chips=$('#chips');
chips.innerHTML=`<label class="chip all"><input type="checkbox" id="allT" checked><span>Alle Themengebiete</span><small>${C.length} Karten</small></label>`+
 keys.map(k=>`<label class="chip"><input type="checkbox" class="tk" value="${k}" checked><span>${esc(T[k])}</span><small>${cnt(k)}</small></label>`).join('');
const num=$('#num'),out=$('#numOut');
let pool=[],deck=[],idx=0;
const sel=()=>[...document.querySelectorAll('.tk:checked')].map(i=>i.value);
const upd=()=>{
  const s=sel();pool=keys.filter(k=>s.includes(k)).flatMap(k=>C.filter(c=>c.t===k));
  $('#allT').checked=s.length===keys.length;$('#allT').indeterminate=s.length>0&&s.length<keys.length;
  const max=Math.max(3,pool.length);const wasAll=+num.value>=+num.max;num.max=max;
  if(wasAll||+num.value>max)num.value=max;
  const n=Math.min(+num.value,pool.length);
  out.textContent=+num.value>=pool.length?`Alle (${pool.length})`:n;
  $('#presets').innerHTML=[5,10,20].filter(v=>v<pool.length).map(v=>`<button class="small" data-v="${v}">${v}</button>`).join('')+`<button class="small" data-v="${max}">Alle</button>`;
  $('#warn').hidden=pool.length>0;$('#start').disabled=pool.length<1;
  $('#start').textContent=pool.length?`Los geht's: ${n} ${n===1?'Karte':'Karten'}`:'Los geht\'s';
};
num.value=C.length;
chips.addEventListener('change',e=>{if(e.target.id==='allT')document.querySelectorAll('.tk').forEach(i=>i.checked=e.target.checked);upd()});
num.addEventListener('input',upd);
$('#presets').addEventListener('click',e=>{const b=e.target.closest('button');if(b){num.value=b.dataset.v;upd()}});
upd();

const views=['setup','cards','done'];
const show=v=>{views.forEach(n=>$('#v-'+n).hidden=n!==v);scrollTo({top:0})};
const begin=list=>{deck=list;idx=0;show('cards');render();$('#inner').focus({preventScroll:true})};
let rnd=true;
$('#start').addEventListener('click',()=>{if(!pool.length)return;
  rnd=document.querySelector('input[name=ord]:checked').value==='rnd';
  $('#again').textContent=rnd?'Gleiche Karten neu mischen':'Gleiche Karten nochmal';
  const n=Math.min(+num.value,pool.length);begin((rnd?sh(pool):pool).slice(0,n))});

/* Karten */
const flip=$('#flip');
const render=()=>{
  const c=deck[idx];flip.classList.remove('on');
  $('#prog').textContent=`Karte ${idx+1} von ${deck.length}`;
  $('#barI').style.width=`${(idx+1)/deck.length*100}%`;
  $('#fTag').textContent=T[c.t];$('#fQ').textContent=c.q;$('#bTag').textContent=T[c.t]+' · Antwort';
  $('#bBody').innerHTML=`<div class="a">${c.a}</div>`+
    (c.b||c.c?`<div class="ex"><span class="lbl">Beispiel</span>${c.b||''}${c.c?`<pre>${esc(c.c)}</pre>`:''}</div>`:'')+
    (c.n?`<div class="nt"><span class="lbl">Gut zu wissen</span>${c.n}</div>`:'');
  $('#prev').disabled=idx===0;$('#next').textContent=idx===deck.length-1?'Fertig':'Weiter';
};
const go=d=>{if(idx+d>=deck.length){$('#doneN').textContent=deck.length;$('#doneT').textContent=`${deck.length===1?'Karte':'Karten'} durchgearbeitet.`;show('done');return}
  if(idx+d<0)return;idx+=d;render()};
$('#inner').addEventListener('click',()=>flip.classList.toggle('on'));
$('#inner').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip.classList.toggle('on')}});
$('#prev').addEventListener('click',()=>go(-1));$('#next').addEventListener('click',()=>go(1));
document.addEventListener('keydown',e=>{if($('#v-cards').hidden||e.target.closest('button,input'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
$('#back').addEventListener('click',()=>show('setup'));
$('#again').addEventListener('click',()=>begin(rnd?sh(deck):deck));
$('#newSel').addEventListener('click',()=>show('setup'));
}
